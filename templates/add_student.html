<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add student | Student Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
<main class="form-card">
    <a class="brand form-brand" href="{{ url_for('home') }}"><span class="brand-mark">S</span><span>Student<span class="brand-light">Hub</span></span></a>
    <p class="eyebrow" style="color:#7b89cf">NEW RECORD</p>
    <h1>Add a student</h1>
    <p class="form-intro">Enter the student's details below. You can edit them later.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
        <label for="name">Student name</label>
        <input id="name" name="name" type="text" maxlength="100" required autofocus placeholder="e.g. Asha Patel" value="{{ request.form.get('name', '') }}">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="1" max="120" required placeholder="Age in years" value="{{ request.form.get('age', '') }}">
        <label for="marks">Marks</label>
        <input id="marks" name="marks" type="number" min="0" max="100" required placeholder="Score from 0 to 100" value="{{ request.form.get('marks', '') }}">
        <div class="form-actions">
            <button class="primary-button" type="submit">Save student</button>
            <a class="secondary-button" href="{{ url_for('home') }}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
